# Runs the generator and browser tests on every pull request and every push to main.
name: Tests

on:
  pull_request:
    # Notes and licence text cannot break the tests, so editing only them skips the run.
    # (No branch rule requires this check, so a skipped run never blocks a merge.)
    paths-ignore: ['ai/**', '*.md', 'LICENSE*']
  push:
    branches: [main]
    paths-ignore: ['ai/**', '*.md', 'LICENSE*']

# Saves runs: a newer push to the same pull request cancels the older, now stale, run.
# Pushes to main are never cancelled (each merge keeps its own result).
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Opens the demo in headless Chromium and checks the UI.
  ui:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56.1 cannot install Chromium on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
